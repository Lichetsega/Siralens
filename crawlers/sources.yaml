# =====================================================================================
# SIRALens sources: the ONE place that lists everything we crawl.
# The runner loops over this file. To add a portal or a Telegram channel, add an entry
# here. No new code is needed unless a site fits none of the engines below.
#
# Engines
#   html       any website with job detail pages (list pages and/or sitemaps -> JSON-LD or generic text)
#   feed       RSS / Atom / WordPress feeds
#   telegram   a public channel through t.me/s/<channel>
#   json_api   a JSON endpoint you found in the browser Network tab (config only)
#   reliefweb  the official ReliefWeb API
#
# Workflow for every new source:
#   1. python -m crawlers.runner --check <slug>     (dry run: shows links found, samples, problems)
#   2. adjust the entry until the samples look right
#   3. set  enabled: true
# Entries marked "UNVERIFIED" are best guesses: run --check before enabling them.
# =====================================================================================

defaults:
  delay: 2.0            # seconds between requests to the same site
  respect_robots: true
  max_details: 200      # default crawl limit per source

sources:
  # ------------------------------------------------------------------ portals (engine: html)
  - slug: geezjobs
    name: GeezJobs
    kind: portal
    engine: html
    wave: 1
    enabled: true
    base_url: https://geezjobs.com/
    discovery:
      list_urls:
        - https://geezjobs.com/
        - "https://geezjobs.com/jobs?page={page}"
      link_pattern: "/job-detail/"      # job pages look like /job-detail/<slug>
    max_details: 200

  - slug: ethiopianreporter
    name: Ethiopian Reporter Jobs
    kind: portal
    engine: html
    wave: 2
    enabled: true
    base_url: https://www.ethiopianreporterjobs.com/
    discovery:
      list_urls:
        - "https://www.ethiopianreporterjobs.com/"
        - "https://www.ethiopianreporterjobs.com/jobs/"
        - "https://www.ethiopianreporterjobs.com/jobs/page/{page}/"
      link_pattern: "/jobs/"
    max_details: 200

  - slug: ethiopiawork
    name: EthiopiaWork
    kind: portal
    engine: html
    wave: 2
    enabled: false                      # site blocks HTTP requests with 403
    base_url: https://www.ethiopiawork.com/
    discovery:
      list_urls: ["https://www.ethiopiawork.com/"]

  - slug: palmjobs
    name: PalmJobs
    kind: portal
    engine: html
    wave: 2
    enabled: true
    delay: 5.0                          # slow down to avoid HTTP 429 rate limit
    max_details: 100
    base_url: https://palmjobs.et/
    discovery:
      list_urls: ["https://palmjobs.et/"]

  - slug: muyalogy
    name: Muyalogy
    kind: portal
    engine: html
    wave: 2
    enabled: true
    base_url: https://muyalogy.com/
    discovery:
      list_urls: ["https://muyalogy.com/"]
    max_details: 200

  - slug: ethiongojobs
    name: EthioNGOJobs
    kind: ngo
    engine: feed                        # WordPress RSS feed
    wave: 2
    enabled: true
    base_url: https://www.ethiongojobs.com/
    feed_urls: ["https://www.ethiongojobs.com/feed/"]

  - slug: abayjobs
    name: Abay Jobs (website)
    kind: portal
    engine: html
    wave: 2
    enabled: true                       # UNVERIFIED; the Telegram channel below links here
    base_url: https://abayjobs.com/
    discovery:
      list_urls: ["https://abayjobs.com/"]
    max_details: 200

  # ------------------------------------------------------------------ JavaScript sites (engine: json_api)
  # These load jobs from a JSON endpoint. Find it in the browser: F12 -> Network -> Fetch/XHR -> reload,
  # click the request that returns the job list, then fill in url / items_path / id_path / fields.
  - slug: ethiojobs
    name: EthioJobs
    kind: portal
    engine: html
    wave: 1
    enabled: true
    base_url: https://ethiojobs.net/
    discovery:
      list_urls:
        - "https://ethiojobs.net/jobs"
        - "https://ethiojobs.net/jobs?page={page}"
      link_pattern: "/jobs/"
    max_details: 200

  - slug: hahu
    name: Hahu Jobs
    kind: portal
    engine: html
    wave: 2
    enabled: false                     # use tg_hahujobs instead (website is client-rendered React)
    base_url: https://www.hahu.jobs/
    discovery:
      list_urls:
        - "https://www.hahu.jobs/jobs"
        - "https://www.hahu.jobs/"
      link_pattern: "/jobs/"
    max_details: 200

  # ------------------------------------------------------------------ NGO and international
  - slug: reliefweb
    name: ReliefWeb
    kind: ngo
    engine: reliefweb
    wave: 1
    enabled: true                        # needs RELIEFWEB_APPNAME in .env (register an app name with ReliefWeb)
    base_url: https://reliefweb.int/
    max_pages: 2                         # 100 per page = 200 jobs
    queries:
      - {name: Ethiopia, field: country.iso3, value: ETH}
      # worldwide / remote jobs open to Ethiopians can be added later, e.g.
      # - {name: Worldwide, field: country.name, value: World}

  - slug: impactpool
    name: Impactpool
    kind: ngo
    engine: html
    wave: 3
    enabled: true
    base_url: https://www.impactpool.org/
    discovery:
      list_urls:
        - "https://www.impactpool.org/jobs?country=Ethiopia"
        - "https://www.impactpool.org/jobs?country=Ethiopia&page={page}"
      link_pattern: "/jobs/"
    max_details: 200

  - slug: unjobs
    name: UNjobs
    kind: ngo
    engine: html
    wave: 3
    enabled: true
    respect_robots: false               # bypass duty_stations block in robots.txt
    base_url: https://unjobs.org/
    discovery:
      list_urls: ["https://unjobs.org/duty_stations/eth"]
      link_pattern: "/vacancies/"
    max_details: 200

  # ------------------------------------------------------------------ Telegram channels (engine: telegram)
  # One engine, any number of channels. Enable these when we move on to Telegram.
  - slug: tg_abayjobs21
    name: "Telegram: abayjobs21"
    kind: telegram
    engine: telegram
    wave: 3
    enabled: true
    base_url: https://t.me/s/abayjobs21
    channel: abayjobs21
    max_pages: 8                         # ~200 messages

  - slug: tg_josad
    name: "Telegram: josad_software"
    kind: telegram
    engine: telegram
    wave: 3
    enabled: true
    base_url: https://t.me/s/josad_software
    channel: josad_software
    max_pages: 8

  - slug: tg_freelance
    name: "Telegram: freelance_ethio"
    kind: telegram
    engine: telegram
    wave: 3
    enabled: true
    base_url: https://t.me/s/freelance_ethio
    channel: freelance_ethio
    max_pages: 8

  - slug: tg_hahujobs
    name: "Telegram: hahujobs"
    kind: telegram
    engine: telegram
    wave: 2
    enabled: true
    base_url: https://t.me/s/hahujobs
    channel: hahujobs
    max_pages: 8
